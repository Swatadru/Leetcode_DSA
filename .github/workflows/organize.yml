name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
    paths:
      - '0*-*/**'  # Triggers when LeetHub pushes a new folder like 0001-two-sum/

jobs:
  organize:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run organization script
        run: python .github/scripts/organize.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all changes
          git add .
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-organize LeetCode solutions"
            # Using the default GITHUB_TOKEN provided by Actions
            git push
          fi
